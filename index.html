<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UK Tenant Dispute Letter Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f4f7f6;
      margin: 0;
      padding: 0;
    }
    /* Estilos de la pantalla de bienvenida (Modal) */
    #languageModal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(26, 54, 93, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      color: #333;
      padding: 40px;
      border-radius: 8px;
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    .modal-content select {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin: 20px 0;
    }
    .modal-content button {
      width: 100%;
      background-color: #2b6cb0;
      color: white;
      border: none;
      padding: 15px;
      font-size: 18px;
      border-radius: 4px;
      cursor: pointer;
    }
    .modal-content button:hover { background-color: #2c5282; }

    /* Estilos de la App principal */
    #mainApp {
      display: none;
      max-width: 700px;
      margin: 40px auto;
      padding: 30px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 { color: #1a365d; }
    .subtitle { color: #666; margin-bottom: 25px; }
    label { font-weight: bold; display: block; margin-top: 20px; }
    .hint { font-size: 0.85em; color: #555; margin-bottom: 8px; }
    input, textarea, select {
      width: 100%; padding: 12px; margin-top: 5px;
      border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;
    }
    .btn-generate {
      margin-top: 25px; background-color: #2f855a; color: white;
      border: none; padding: 15px; font-size: 18px;
      border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold;
    }
    .btn-generate:hover { background-color: #276749; }
  </style>
</head>
<body>

  <!-- PANTALLA DE SELECCIÓN DE IDIOMA (SOLO INGLÉS) -->
  <div id="languageModal">
    <div class="modal-content">
      <h2>Welcome</h2>
      <p>Please select your preferred language</p>
      <select id="langSelect">
        <option value="en">English</option>
        <option value="es">Español (Spanish)</option>
        <option value="pl">Polski (Polish)</option>
        <option value="ro">Română (Romanian)</option>
        <option value="pt">Português (Portuguese)</option>
        <option value="it">Italiano (Italian)</option>
        <option value="fr">Français (French)</option>
        <option value="de">Deutsch (German)</option>
        <option value="bg">Български (Bulgarian)</option>
        <option value="lt">Lietuvių (Lithuanian)</option>
        <option value="uk">Українська (Ukrainian)</option>
      </select>
      <button onclick="startApp()">Start</button>
    </div>
  </div>

  <!-- APLICACIÓN PRINCIPAL -->
  <div id="mainApp">
    <h1>UK Tenant Dispute Letter Generator</h1>
    <p id="ui-subtitle" class="subtitle">Dispute Letter Generator</p>

    <form id="disputeForm" onsubmit="event.preventDefault(); alert('Conexión con IA próximamente...');">
      
      <label id="lbl-name" for="tenantName">Your Name:</label>
      <input type="text" id="tenantName" required>

      <label id="lbl-landlord" for="landlordName">Landlord or Agency Name:</label>
      <input type="text" id="landlordName" required>

      <label id="lbl-issue" for="issueCategory">Issue Type:</label>
      <select id="issueCategory">
        <option id="opt-deposit" value="deposit">Deposit Retention</option>
        <option id="opt-damp" value="damp">Damp and Mould</option>
        <option id="opt-heating" value="heating">Broken Heating or Hot Water</option>
        <option id="opt-repairs" value="repairs">General Repairs Needed</option>
      </select>

      <label id="lbl-desc" for="userStory">Describe your problem:</label>
      <div id="hint-desc" class="hint">Explain what happened, dates, and required solution.</div>
      <textarea id="userStory" rows="6" required></textarea>

      <button type="submit" id="btn-submit" class="btn-generate">Generate Formal Dispute Letter</button>
    </form>
  </div>

  <!-- CÓDIGO JAVASCRIPT (LÓGICA DEL IDIOMA) -->
  <script>
    const translations = {
      es: { subtitle: "Generador de Cartas de Reclamación para Inquilinos", name: "Tu Nombre", landlord: "Nombre del Casero o Agencia", issue: "Tipo de Problema", deposit: "Retención de Fianza", damp: "Humedades y Moho", heating: "Falta de Calefacción o Agua Caliente", repairs: "Reparaciones Generales", desc: "Describe tu problema", hint: "Explica qué pasó, las fechas y qué solución necesitas. La IA generará la carta legal en inglés formal.", placeholder: "Ejemplo: Llevo 3 semanas sin calefacción...", btn: "Generar Carta Formal" },
      pl: { subtitle: "Generator Listów Spornych dla Najemców", name: "Twoje Imię", landlord: "Nazwa Wynajmującego lub Agencji", issue: "Rodzaj Problemu", deposit: "Zatrzymanie Kaucji", damp: "Wilgoć i Pleśń", heating: "Brak Ogrzewania lub Ciepłej Wody", repairs: "Ogólne Naprawy", desc: "Opisz swój problem", hint: "Wyjaśnij co się stało, podaj daty i jakiego rozwiązania oczekujesz.", placeholder: "Przykład: Od 3 tygodni nie mam ogrzewania...", btn: "Wygeneruj Formalny List" },
      ro: { subtitle: "Generator de Scrisori de Dispută pentru Chiriași", name: "Numele Tău", landlord: "Numele Proprietarului sau Agenției", issue: "Tipul Problemei", deposit: "Reținerea Garanției", damp: "Umezeală și Mucegai", heating: "Lipsă Căldură sau Apă Caldă", repairs: "Reparații Generale", desc: "Descrie problema ta", hint: "Explică ce s-a întâmplat, datele și ce soluție dorești.", placeholder: "Exemplu: Nu am căldură de 3 săptămâni...", btn: "Generează Scrisoare Formală" },
      pt: { subtitle: "Gerador de Cartas de Reclamação para Inquilinos", name: "Teu Nome", landlord: "Nome do Senhorio ou Agência", issue: "Tipo de Problema", deposit: "Retenção de Caução", damp: "Humidade e Bolor", heating: "Falta de Aquecimento ou Água Quente", repairs: "Reparações Gerais", desc: "Descreve o teu problema", hint: "Explica o que aconteceu, as datas e que solução precisas.", placeholder: "Exemplo: Estou sem aquecimento há 3 semanas...", btn: "Gerar Carta Formal" },
      it: { subtitle: "Generatore di Lettere di Contestazione per Inquilini", name: "Il Tuo Nome", landlord: "Nome del Proprietario o Agenzia", issue: "Tipo di Problema", deposit: "Trattenuta della Caparra", damp: "Umidità e Muffa", heating: "Mancanza di Riscaldamento", repairs: "Riparazioni Generali", desc: "Descrivi il tuo problema", hint: "Spiega cosa è successo, le date e quale soluzione cerchi.", placeholder: "Esempio: Sono senza riscaldamento da 3 settimane...", btn: "Genera Lettera Formale" },
      fr: { subtitle: "Générateur de Lettres de Litige pour Locataires", name: "Votre Nom", landlord: "Nom du Propriétaire ou Agence", issue: "Type de Problème", deposit: "Retenue de Caution", damp: "Humidité et Moisissure", heating: "Pas de Chauffage", repairs: "Réparations Générales", desc: "Décrivez votre problème", hint: "Expliquez ce qui s'est passé, les dates et la solution attendue.", placeholder: "Exemple : Je n'ai pas de chauffage depuis 3 semaines...", btn: "Générer Lettre Formelle" },
      de: { subtitle: "Beschwerdebrief-Generator für Mieter", name: "Dein Name", landlord: "Name des Vermieters", issue: "Art des Problems", deposit: "Einbehaltene Kaution", damp: "Feuchtigkeit und Schimmel", heating: "Keine Heizung oder Warmwasser", repairs: "Allgemeine Reparaturen", desc: "Beschreibe dein Problem", hint: "Erkläre, was passiert ist, die Daten und die benötigte Lösung.", placeholder: "Beispiel: Ich habe seit 3 Wochen keine Heizung...", btn: "Formellen Brief Generieren" },
      bg: { subtitle: "Генератор на Жалби за Наематели", name: "Твоето Име", landlord: "Име на Хазяин или Агенция", issue: "Тип Проблем", deposit: "Задържане на Депозит", damp: "Влага и Мухъл", heating: "Липса на Отопление", repairs: "Общи Ремонти", desc: "Опишете вашия проблем", hint: "Обяснете какво се е случило, датите и какво решение търсите.", placeholder: "Пример: Нямам отопление от 3 седмици...", btn: "Генериране на Формално Писмо" },
      lt: { subtitle: "Nuomininkų Skundų Laiškų Generatorius", name: "Tavo Vardas", landlord: "Nuomotojo Pavadinimas", issue: "Problemos Tipas", deposit: "Užstato Sulaikymas", damp: "Drėgmė ir Pelėsis", heating: "Nėra Šildymo", repairs: "Bendrieji Taisymai", desc: "Apibūdinkite problemą", hint: "Paaiškinkite, kas nutiko, datas ir kokio sprendimo reikia.", placeholder: "Pavyzdys: Jau 3 savaites neturiu šildymo...", btn: "Generuoti Oficialų Laišką" },
      uk: { subtitle: "Генератор Скарг для Орендарів", name: "Ваше Ім'я", landlord: "Ім'я Орендодавця", issue: "Тип Проблеми", deposit: "Утримання Депозиту", damp: "Вогкість і Цвіль", heating: "Відсутність Опалення", repairs: "Загальний Ремонт", desc: "Опишіть проблему", hint: "Поясніть, що сталося, дати та яке рішення потрібне.", placeholder: "Приклад: Я без опалення 3 тижні...", btn: "Згенерувати Офіційний Лист" }
    };

    function startApp() {
      const langCode = document.getElementById("langSelect").value;
      
      document.getElementById("languageModal").style.display = "none";
      document.getElementById("mainApp").style.display = "block";

      if (langCode === 'en') {
        // Si es inglés, no añadimos traducciones
        document.getElementById("ui-subtitle").innerText = "Dispute Letter Generator";
        document.getElementById("lbl-name").innerText = "Your Name:";
        document.getElementById("tenantName").placeholder = "e.g. Alex Garcia";
        document.getElementById("lbl-landlord").innerText = "Landlord or Agency Name:";
        document.getElementById("lbl-issue").innerText = "Issue Type:";
        document.getElementById("opt-deposit").innerText = "Deposit Retention";
        document.getElementById("opt-damp").innerText = "Damp and Mould";
        document.getElementById("opt-heating").innerText = "Broken Heating or Hot Water";
        document.getElementById("opt-repairs").innerText = "General Repairs Needed";
        document.getElementById("lbl-desc").innerText = "Describe your problem:";
        document.getElementById("hint-desc").innerText = "Explain what happened, dates, and required solution.";
        document.getElementById("userStory").placeholder = "Example: I have been without heating for 3 weeks...";
        document.getElementById("btn-submit").innerText = "Generate Formal Dispute Letter";
      } else {
        // Si es otro idioma, aplicamos el formato bilingüe (Inglés / Idioma)
        const t = translations[langCode];
        document.getElementById("ui-subtitle").innerText = "Dispute Letter Generator / " + t.subtitle;
        document.getElementById("lbl-name").innerText = "Your Name / " + t.name + ":";
        document.getElementById("tenantName").placeholder = "e.g. Alex Garcia";
        document.getElementById("lbl-landlord").innerText = "Landlord or Agency Name / " + t.landlord + ":";
        document.getElementById("lbl-issue").innerText = "Issue Type / " + t.issue + ":";
        document.getElementById("opt-deposit").innerText = "Deposit Retention / " + t.deposit;
        document.getElementById("opt-damp").innerText = "Damp and Mould / " + t.damp;
        document.getElementById("opt-heating").innerText = "Broken Heating or Hot Water / " + t.heating;
        document.getElementById("opt-repairs").innerText = "General Repairs Needed / " + t.repairs;
        document.getElementById("lbl-desc").innerText = "Describe your problem / " + t.desc + ":";
        document.getElementById("hint-desc").innerText = "Explain what happened, dates, and required solution.\n" + t.hint;
        document.getElementById("userStory").placeholder = t.placeholder;
        document.getElementById("btn-submit").innerText = "Generate Formal Dispute Letter / " + t.btn;
      }
    }
  </script>

</body>
</html>
