<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UK Tenant Dispute Letter Generator</title>
  <style>
    body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; background-color: #f4f7f6; margin: 0; padding: 0; }
    #languageModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(26, 54, 93, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 1000; }
    .modal-content { background: white; color: #333; padding: 40px; border-radius: 8px; text-align: center; max-width: 400px; width: 90%; }
    .modal-content select { width: 100%; padding: 12px; font-size: 16px; margin: 20px 0; }
    .modal-content button { width: 100%; background-color: #2b6cb0; color: white; border: none; padding: 15px; font-size: 18px; border-radius: 4px; cursor: pointer; }
    .modal-content button:hover { background-color: #2c5282; }
    #mainApp { display: none; max-width: 700px; margin: 40px auto; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1 { color: #1a365d; }
    .subtitle { color: #666; margin-bottom: 25px; }
    label { font-weight: bold; display: block; margin-top: 20px; }
    .hint { font-size: 0.85em; color: #555; margin-bottom: 8px; }
    input, textarea, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .api-key-box { background: #e8f0fe; border-left: 4px solid #1a73e8; padding: 15px; margin-bottom: 20px; font-size: 0.9em; }
    .btn-generate { margin-top: 25px; background-color: #1a73e8; color: white; border: none; padding: 15px; font-size: 18px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
    .btn-generate:hover { background-color: #1557b0; }
    .btn-generate:disabled { background-color: #a0aec0; cursor: not-allowed; }
    #outputSection { display: none; margin-top: 30px; border-top: 2px solid #e2e8f0; padding-top: 20px; }
    #generatedLetter { width: 100%; height: 350px; padding: 15px; font-family: "Times New Roman", Times, serif; font-size: 16px; border: 1px solid #cbd5e0; border-radius: 4px; background-color: #f8fafc; line-height: 1.5; white-space: pre-wrap; }
  </style>
</head>
<body>

  <!-- MODAL DE SELECCIÓN DE IDIOMA -->
  <div id="languageModal">
    <div class="modal-content">
      <h2>Welcome</h2>
      <p>Please select your preferred language</p>
      <select id="langSelect">
        <option value="en">English</option>
        <option value="es">Español (Spanish)</option>
        <option value="pl">Polski (Polish)</option>
        <option value="ro">Română (Romanian)</option>
        <option value="pt">Português (Portuguese)</option>
        <option value="it">Italiano (Italian)</option>
        <option value="fr">Français (French)</option>
        <option value="de">Deutsch (German)</option>
        <option value="bg">Български (Bulgarian)</option>
        <option value="lt">Lietuvių (Lithuanian)</option>
        <option value="uk">Українська (Ukrainian)</option>
      </select>
      <button onclick="startApp()">Start</button>
    </div>
  </div>

  <!-- APLICACIÓN PRINCIPAL -->
  <div id="mainApp">
    <h1>UK Tenant Dispute Letter Generator</h1>
    <p id="ui-subtitle" class="subtitle">Dispute Letter Generator</p>

    <!-- CAJA API KEY -->
    <div class="api-key-box">
      <label id="lbl-api" for="apiKey" style="margin-top: 0;">Google Gemini API Key (Required):</label>
      <div class="hint">Your key is not stored. It is only used locally to contact Gemini.</div>
      <input type="password" id="apiKey" placeholder="AIzaSy..." required>
    </div>

    <form id="disputeForm" onsubmit="generateLetter(event)">
      <label id="lbl-name" for="tenantName">Your Name:</label>
      <input type="text" id="tenantName" required>

      <label id="lbl-landlord" for="landlordName">Landlord or Agency Name:</label>
      <input type="text" id="landlordName" required>

      <label id="lbl-issue" for="issueCategory">Issue Type:</label>
      <select id="issueCategory">
        <option id="opt-deposit" value="Deposit Retention">Deposit Retention</option>
        <option id="opt-damp" value="Damp and Mould">Damp and Mould</option>
        <option id="opt-heating" value="Broken Heating or Hot Water">Broken Heating or Hot Water</option>
        <option id="opt-repairs" value="General Repairs Needed">General Repairs Needed</option>
      </select>

      <label id="lbl-desc" for="userStory">Describe your problem:</label>
      <div id="hint-desc" class="hint">Explain what happened, dates, and required solution.</div>
      <textarea id="userStory" rows="6" required></textarea>

      <button type="submit" id="btn-submit" class="btn-generate">Generate Formal Dispute Letter</button>
    </form>

    <div id="outputSection">
      <h2 id="lbl-result">Generated Letter (Ready to copy)</h2>
      <textarea id="generatedLetter" readonly></textarea>
    </div>
  </div>

  <script>
    const translations = {
      es: {
        subtitle: "Generador de Cartas de Reclamación",
        api: "Clave de API de Google Gemini (Obligatorio)",
        name: "Tu Nombre",
        landlord: "Casero o Agencia",
        issue: "Problema",
        deposit: "Retención de Fianza",
        damp: "Humedades y Moho",
        heating: "Falta de Calefacción o Agua Caliente",
        repairs: "Reparaciones",
        desc: "Describe tu problema",
        hint: "Explica qué pasó, las fechas y qué solución necesitas. La IA generará la carta legal en inglés.",
        btn: "Generar Carta Formal",
        result: "Carta Generada (Inglés Formal)"
      }
    };

    let originalButtonText = "Generate Formal Dispute Letter";

    function startApp() {
      const langCode = document.getElementById("langSelect").value;
      document.getElementById("languageModal").style.display = "none";
      document.getElementById("mainApp").style.display = "block";

      if (langCode !== 'en' && translations[langCode]) {
        const t = translations[langCode];
        document.getElementById("ui-subtitle").innerText = "Dispute Letter Generator / " + t.subtitle;
        document.getElementById("lbl-api").innerText = "Google Gemini API Key / " + t.api + ":";
        document.getElementById("lbl-name").innerText = "Your Name / " + t.name + ":";
        document.getElementById("lbl-landlord").innerText = "Landlord / " + t.landlord + ":";
        document.getElementById("lbl-issue").innerText = "Issue Type / " + t.issue + ":";
        document.getElementById("opt-deposit").innerText = "Deposit / " + t.deposit;
        document.getElementById("opt-damp").innerText = "Damp / " + t.damp;
        document.getElementById("opt-heating").innerText = "Heating / " + t.heating;
        document.getElementById("opt-repairs").innerText = "Repairs / " + t.repairs;
        document.getElementById("lbl-desc").innerText = "Describe your problem / " + t.desc + ":";
        document.getElementById("hint-desc").innerText = "Explain what happened / " + t.hint;
        originalButtonText = "Generate / " + t.btn;
        document.getElementById("btn-submit").innerText = originalButtonText;
        document.getElementById("lbl-result").innerText = "Generated Letter / " + t.result;
      }
    }

    async function generateLetter(event) {
      event.preventDefault();

      const apiKey = document.getElementById("apiKey").value.trim();
      const tenantName = document.getElementById("tenantName").value;
      const landlordName = document.getElementById("landlordName").value;
      const issueType = document.getElementById("issueCategory").value;
      const userStory = document.getElementById("userStory").value;
      const btnSubmit = document.getElementById("btn-submit");
      const outputSection = document.getElementById("outputSection");
      const generatedLetter = document.getElementById("generatedLetter");

      if (!apiKey) {
        alert("Please enter your Google Gemini API Key.");
        return;
      }

      btnSubmit.innerText = "Generating Letter... Please wait...";
      btnSubmit.disabled = true;

      const promptText = `You are an expert British housing lawyer. Your task is to write a highly formal and legally sound dispute letter from a tenant to their landlord or agency.
Tenant Name: ${tenantName}
Landlord/Agency Name: ${landlordName}
Issue Category: ${issueType}
User's Story (adapt from any language into formal English): ${userStory}

Instructions:
1. Write ONLY the formal letter in British English. Do not include markdown formatting fences (like \`\`\`) or introductory comments.
2. Naturally cite relevant UK housing legislation (e.g. Housing Act 2004 / Tenant Fees Act 2019 for deposit protection, Section 11 of the Landlord and Tenant Act 1985 for repairs, or Homes (Fitness for Human Habitation) Act 2018).
3. Tone must be professional, assertive, and legal.
4. Include formal placeholders for date and address: [Current Date] and [Tenant Address].`;

      try {
        // Modelo oficial: gemini-3.8-flash
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptText }] }]
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const letter = data.candidates[0].content.parts[0].text;
        generatedLetter.value = letter;
        outputSection.style.display = "block";
      } catch (error) {
        alert("Error: " + error.message);
      } finally {
        btnSubmit.innerText = originalButtonText;
        btnSubmit.disabled = false;
      }
    }
  </script>
</body>
</html>
