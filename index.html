<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UK Tenant Dispute Letter Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #333;
    }
    h1 {
      color: #1a365d;
    }
    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
    }
    .hint {
      font-size: 0.85em;
      color: #555;
      margin-bottom: 5px;
    }
    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      margin-top: 20px;
      background-color: #2b6cb0;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background-color: #2c5282;
    }
    .output-section {
      margin-top: 30px;
      display: none;
      background: #f7fafc;
      padding: 20px;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <h1>UK Tenant Dispute Letter Generator</h1>
  <p class="subtitle">Generador de Cartas de Reclamación para Inquilinos en Reino Unido</p>

  <form id="disputeForm">
    <label for="tenantName">Your Name / Tu Nombre:</label>
    <input type="text" id="tenantName" placeholder="e.g. Alex Garcia" required>

    <label for="landlordName">Landlord / Agency Name (Nombre del Casero o Agencia):</label>
    <input type="text" id="landlordName" placeholder="e.g. Acme Properties Ltd" required>

    <label for="issueCategory">Issue Type / Tipo de Problema:</label>
    <select id="issueCategory">
      <option value="deposit">Deposit Retention / Retención de Fianza</option>
      <option value="damp">Damp and Mould / Humedades y Moho</option>
      <option value="heating">Broken Heating or Hot Water / Falta de Calefacción o Agua Caliente</option>
      <option value="repairs">General Repairs Needed / Reparaciones Generales</option>
    </select>

    <label for="userStory">Describe your problem (in Spanish or English) / Describe tu problema:</label>
    <div class="hint">Explica qué pasó, las fechas y qué solución necesitas. La IA generará la carta legal en inglés formal.</div>
    <textarea id="userStory" rows="6" placeholder="Ejemplo: Llevo 3 semanas sin calefacción. Le avisé al casero el día 2 de octubre y no ha mandado a nadie..." required></textarea>

    <button type="submit">Generate Formal Dispute Letter / Generar Carta Formal</button>
  </form>

  <div id="outputSection" class="output-section">
    <h2>Generated Letter (Formal English)</h2>
    <textarea id="generatedLetter" rows="10" readonly></textarea>
  </div>

</body>
</html>
